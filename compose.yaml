services:
  adguardhome:
    image: ${ADGUARD_IMAGE:-adguard/adguardhome:latest}
    container_name: adguardhome
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${ADGUARD_DATA_DIR:-/opt/adguardhome}/work:/opt/adguardhome/work
      - ${ADGUARD_DATA_DIR:-/opt/adguardhome}/conf:/opt/adguardhome/conf
